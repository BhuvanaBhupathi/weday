version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: friday_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: friday
      POSTGRES_PASSWORD: friday_dev_password
      POSTGRES_DB: friday_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U friday -d friday_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: friday_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass friday_redis_dev
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'friday_redis_dev', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: friday_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: friday_minio_user
      MINIO_ROOT_PASSWORD: friday_minio_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
